packages:
  - "apps/*"
  - "packages/*"

# Use a flat node_modules layout (like npm/bun) so workspace packages can
# resolve hoisted tooling. Keeps the Bun -> pnpm migration low-friction.
nodeLinker: hoisted

# Native packages allowed to run install/build lifecycle scripts.
onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - sharp
  - unrs-resolver
