packages:
  - "apps/*"
  - "packages/*"

# Use a flat node_modules layout (like npm/bun) so workspace packages can
# resolve hoisted tooling. Keeps the Bun -> pnpm migration low-friction.
nodeLinker: hoisted

# Native packages allowed to run install/build lifecycle scripts.
# pnpm v11 replaced onlyBuiltDependencies with the allowBuilds map.
allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
  unrs-resolver: true

overrides:
  brace-expansion@<1.1.18: ^5.0.0
  esbuild@<=0.24.2: ^0.28.0
  esbuild@>=0.27.3 <0.28.1: ^0.28.1
  fast-uri@>=3.0.0 <3.1.5: ^3.1.5
  js-yaml@>=4.0.0 <4.3.1: ^4.3.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<=8.5.22: ^8.5.23
