---
name: Publish to npm

permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run type check
        run: pnpm exec turbo run tsc --filter=create-respondeo-app

      - name: Run format check
        run: pnpm run format:check

      - name: Run lint
        run: pnpm exec turbo run lint --filter=create-respondeo-app

      - name: Build
        run: pnpm exec turbo run build --filter=create-respondeo-app

      - name: Package
        working-directory: packages/create-respondeo-app
        run: pnpm pack

      - name: Publish to npm
        working-directory: packages/create-respondeo-app
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
